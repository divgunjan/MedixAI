    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevents scrollbars from flashing during animations */
        }
        /* Fade-in animation for chat messages */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        /* Typing indicator animation */
        @keyframes typing {
            0% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0); }
        }
        .dot {
            animation: typing 1.2s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        /* Typewriter cursor */
        .typing-cursor::after {
            content: '|';
            display: inline-block;
            margin-left: 3px;
            animation: blink-caret 0.75s step-end infinite;
        }

        @keyframes blink-caret {
            from, to { color: transparent; }
            50% { color: #374151; } /* gray-700 */
        }
    </style>
</head>

    <script>
        // Chat simulation script
        const chatContent = document.getElementById('chat-content');
        const chatArea = document.getElementById('chat-area');
        const messages = [
            { from: 'user', text: "I've had a persistent dry cough and a mild fever for two days. Should I be concerned?" },
            { from: 'bot', thinking: true },
            { from: 'bot', text: "I understand your concern. A dry cough and mild fever are common symptoms for several conditions, from the common cold to the flu. It's important to monitor your symptoms." },
            { from: 'bot', text: "For your safety, I recommend you stay hydrated and get plenty of rest. If your fever worsens or you experience difficulty breathing, please consult a healthcare professional immediately." },
            { from: 'user', text: "Okay, thank you for the advice!" },
            { from: 'bot', thinking: true },
            { from: 'bot', text: "You're welcome! Remember, I am an AI assistant and not a substitute for a real doctor. Take care and feel better soon. Is there anything else I can help with?" }
        ];

        function createMessageElement(message) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${message.from === 'user' ? 'justify-end' : 'justify-start'}`;
            
            if (message.thinking) {
                wrapper.innerHTML = `
                    <div class="bg-gray-200 rounded-lg p-3 max-w-[85%] fade-in">
                        <div class="flex items-center space-x-1">
                            <div class="w-2 h-2 bg-gray-400 rounded-full dot"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full dot"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full dot"></div>
                        </div>
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="${message.from === 'user' ? 'bg-green-100' : 'bg-white'} rounded-lg p-3 max-w-[85%] shadow-sm fade-in">
                        <p class="text-gray-800">${message.text}</p>
                    </div>
                `;
            }
            return wrapper;
        }

        async function runSimulation() {
            chatContent.innerHTML = '';
            let thinkingMessageElement = null;

            for (const message of messages) {
                if (thinkingMessageElement) {
                    thinkingMessageElement.remove();
                    thinkingMessageElement = null;
                }
                
                const element = createMessageElement(message);
                chatContent.appendChild(element);
                chatArea.scrollTop = chatArea.scrollHeight;

                if (message.thinking) {
                    thinkingMessageElement = element;
                }
                
                // Determine delay based on message type
                const delay = message.thinking ? 2500 : (message.from === 'user' ? 2000 : message.text.length * 40);
                await new Promise(resolve => setTimeout(resolve, delay > 4000 ? 4000 : delay));
            }
            
            // Restart simulation after a pause
            setTimeout(runSimulation, 5000);
        }

        // Typewriter effect script
        const typewriterElement = document.getElementById('typewriter-text');
        const phrases = [
            "Your Personal AI Health Assistant.",
            "आपका व्यक्तिगत AI स्वास्थ्य सहायक।",
            "ଆପଣଙ୍କର ବ୍ୟକ୍ତିଗତ AI ସ୍ୱାସ୍ଥ୍ୟ ସହାୟକ।"
        ];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingSpeed = 100;
        const deletingSpeed = 50;
        const delayBetweenPhrases = 2000;

        function typeWriter() {
            const currentPhrase = phrases[phraseIndex];
            let displayText = '';

            if (isDeleting) {
                displayText = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                displayText = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            typewriterElement.textContent = displayText;

            let typeDelay = isDeleting ? deletingSpeed : typingSpeed;

            if (!isDeleting && charIndex === currentPhrase.length) {
                typeDelay = delayBetweenPhrases;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                typeDelay = 500;
            }

            setTimeout(typeWriter, typeDelay);
        }


        // Start simulations when the page loads
        window.addEventListener('load', () => {
            runSimulation();
            typeWriter();
        });

    </script>
