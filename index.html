        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Fade-in animation for chat messages */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Typing indicator animation */
        @keyframes typing {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .dot {
            animation: typing 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* New blinking cursor animation for the tagline */
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .animate-blink {
            animation: blink 0.7s infinite step-start;
        }
    </style>
</head>

    <script>
        // Chat simulation script
        const chatContent = document.getElementById('chat-content');
        const chatArea = document.getElementById('chat-area');
        let simulationRunning = true; // Control flag

        const messages = [
            { from: 'bot', text: "Welcome to MedixAI! I'm here to provide quick, preliminary health information. Please remember, I am an AI and not a substitute for a doctor.", delay: 3000 },
            { from: 'user', text: "I've had a persistent dry cough and a mild fever for two days. Should I be concerned?", delay: 2000 },
            { from: 'bot', thinking: true, delay: 2500 },
            { from: 'bot', text: "I understand your concern. A dry cough and mild fever are common symptoms for several conditions, from the common cold to the flu. It's important to monitor your symptoms.", delay: 4000 },
            { from: 'bot', text: "For your safety, I recommend you stay hydrated and get plenty of rest. If your fever worsens or you experience difficulty breathing, please consult a healthcare professional immediately.", delay: 4500 }
        ];

        function createMessageElement(message) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${message.from === 'user' ? 'justify-end' : 'justify-start'}`;

            if (message.thinking) {
                // This is the typing indicator
                wrapper.innerHTML = `
                    <div class="bg-gray-200 rounded-xl p-3 max-w-[85%] fade-in">
                        <div class="flex items-center space-x-1">
                            <div class="w-2 h-2 bg-gray-400 rounded-full dot"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full dot"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full dot"></div>
                        </div>
                    </div>
                `;
            } else {
                // This is a standard message bubble
                wrapper.innerHTML = `
                    <div class="${message.from === 'user' ? 'bg-green-100' : 'bg-white'} rounded-xl p-3 max-w-[85%] shadow-md fade-in">
                        <p class="text-gray-800">${message.text}</p>
                    </div>
                `;
            }
            return wrapper;
        }

        async function runSimulation() {
            chatContent.innerHTML = '';
            let thinkingMessageElement = null;

            for (const message of messages) {
                if (!simulationRunning) return; // Stop if the flag is unset

                // Remove the previous thinking indicator if it exists
                if (thinkingMessageElement) {
                    thinkingMessageElement.remove();
                    thinkingMessageElement = null;
                }

                const element = createMessageElement(message);
                chatContent.appendChild(element);
                chatArea.scrollTop = chatArea.scrollHeight;

                if (message.thinking) {
                    thinkingMessageElement = element;
                }

                // Use the configured delay for the message
                await new Promise(resolve => setTimeout(resolve, message.delay || 2000));
            }

            // Remove the final thinking indicator if it's the last element
            if (thinkingMessageElement) {
                thinkingMessageElement.remove();
            }

            // Add a final call to action placeholder
            chatContent.appendChild(createMessageElement({ from: 'bot', text: 'To start a real consultation, click the "MedixAI Start Consultation" button on the left!' }));
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // --- Typewriter Animation Logic ---
        const phrases = [
            "Your Personal AI Health Assistant", // English
            "आपका व्यक्तिगत एआई स्वास्थ्य सहायक", // Hindi
            "ଆପଣଙ୍କର ବ୍ୟକ୍ତିଗତ AI ସ୍ୱାସ୍ଥ୍ୟ ସହାୟକ" // Odia
        ];

        const typingSpeed = 70; // ms per character
        const erasingSpeed = 50; // ms per character
        const delayBetweenPhrases = 2000; // ms pause at end of typing

        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        const typewriterTextElement = document.getElementById('typewriter-text');

        function typeWriter() {
            if (!typewriterTextElement) return; // Safety check

            const currentPhrase = phrases[phraseIndex];

            if (isDeleting) {
                // Deleting phase: removes one character at a time
                typewriterTextElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                // Typing phase: adds one character at a time
                typewriterTextElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            let speed = isDeleting ? erasingSpeed : typingSpeed;

            if (!isDeleting && charIndex === currentPhrase.length) {
                // Done typing the current phrase, wait for delay, then start deleting
                speed = delayBetweenPhrases;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                // Done deleting, switch to the next phrase
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                speed = 500; // Small pause before starting the next phrase
            }

            setTimeout(typeWriter, speed);
        }
        // --- End Typewriter Animation Logic ---


        // Start initialization when the page loads
        window.addEventListener('load', () => {
            runSimulation();
            typeWriter(); // Start the dynamic tagline animation
        });

    </script>
